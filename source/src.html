<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Color Hunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>/*CROPPER_CSS*/</style>
<style>
:root{--paper:#F6F2EA;--card:#FFFDF9;--ink:#1E1B17;--muted:#6E665C;--line:#E6DFD3;--r:20px;--serif:'Poppins',system-ui,sans-serif;--sans:'Poppins',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:18px 18px 96px}
.wrap.wide{max-width:900px}
.topbar{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:22px;min-height:44px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.02em;text-decoration:none}
.dots{display:inline-grid;grid-template-columns:repeat(3,9px);gap:3px}.dots i{width:9px;height:9px;border-radius:3px;display:block}
h1,h2,h3{font-family:var(--serif);font-weight:700;letter-spacing:-.01em;margin:0}
h1,h2{text-transform:uppercase}
h1{font-size:clamp(38px,9vw,62px);line-height:1.02}
h2{font-size:clamp(26px,6vw,34px);line-height:1.08}
h3{font-size:21px;line-height:1.15}
p{line-height:1.5;margin:0}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.stack>*+*{margin-top:14px}
.stack-lg>*+*{margin-top:26px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap-row{flex-wrap:wrap}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:var(--ink);color:#fff;border-radius:999px;padding:13px 22px;font-weight:600;font-size:16px;text-decoration:none;transition:transform .1s,opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.soft{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.block{width:100%}
.btn.sm{padding:8px 14px;font-size:14px}
.btn.lg{padding:17px 26px;font-size:17px}
.btn[disabled]{opacity:.35;pointer-events:none}
.iconbtn{width:42px;height:42px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);font-size:18px}
input,textarea,select{font:inherit;font-size:16px;width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--ink);outline-offset:1px}
input[type=color]{padding:2px;height:48px;width:56px;flex:none;border-radius:12px;cursor:pointer}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--ink)}
label.field{display:block}
label.field>span{display:block;font-size:13px;font-weight:600;margin-bottom:7px}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.code-input{font-family:var(--serif)!important;font-size:42px!important;letter-spacing:.42em;text-align:center;padding:10px 0 10px .42em!important;font-weight:500}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600}
.codechip{font-family:var(--serif);font-weight:600;letter-spacing:.12em;font-size:17px;padding:8px 14px}
.hero-swatches{display:flex;gap:8px;margin:6px 4px 22px}
.hero-swatches i{flex:1;height:64px;border-radius:12px;display:block;transform:rotate(var(--rot));box-shadow:0 6px 18px rgba(30,27,23,.08)}
.steps{display:grid;gap:12px;counter-reset:s}
.steps>div{display:flex;gap:14px;align-items:flex-start}
.steps b.n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif)}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);text-decoration:none}
.list-item:first-child{border-top:0}
.swatch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.swatch{border-radius:16px;border:2px solid transparent;background:#fff;padding:6px;text-align:left;position:relative;box-shadow:0 1px 0 var(--line)}
.swatch .sw{height:62px;border-radius:11px;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.swatch .nm{font-size:13px;font-weight:600;margin:7px 3px 2px;display:block}
.swatch .sub{font-size:11px;color:var(--muted);margin:0 3px 3px;display:block;min-height:13px}
.swatch.on{border-color:var(--ink)}
.swatch.off{opacity:.55}
.swatch .tick{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:#fff;color:var(--ink);font-size:13px;display:none;align-items:center;justify-content:center;font-weight:700}
.swatch.on .tick{display:flex}
.swatch.taken{opacity:.45;pointer-events:none}
.mode-cards{display:grid;gap:10px}
.mode-card{display:flex;gap:12px;text-align:left;padding:14px;border-radius:16px;border:2px solid var(--line);background:#fff}
.mode-card.on{border-color:var(--ink)}
.mode-card .ic{font-size:22px;flex:none;width:30px;text-align:center}
.mode-card b{display:block;font-size:15px}
.mode-card span{font-size:13px;color:var(--muted)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:99px;background:#D8D0C2;transition:.2s}
.switch i:after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+i{background:var(--ink)}
.switch input:checked+i:after{transform:translateX(20px)}
.colorcard{border-radius:24px;padding:22px;position:relative;overflow:hidden}
.colorcard .big{font-family:var(--serif);font-size:clamp(38px,10vw,58px);line-height:1;font-weight:800;text-transform:uppercase;letter-spacing:-.01em}
.framed{border-style:solid;border-width:6px;border-radius:14px;background:#eee center/cover no-repeat;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:34px}
.selfie-sm{width:80px;flex:none;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.avatar{width:46px;height:46px;border-radius:50%;flex:none;background:#eee center/cover no-repeat;border:3px solid;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:19px}
.progress{height:8px;border-radius:99px;background:rgba(0,0,0,.08);overflow:hidden}
.progress i{display:block;height:100%;border-radius:99px}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media(min-width:620px){.photo-grid{grid-template-columns:repeat(4,1fr)}}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#e9e3d8}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .star{position:absolute;left:6px;top:6px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.88);display:flex;align-items:center;justify-content:center;font-size:16px;color:#9b9286}
.ph .star.on{background:#FFD23F;color:#1E1B17}
.ph .del{position:absolute;right:6px;top:6px;width:30px;height:30px;border-radius:50%;background:rgba(30,27,23,.6);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center}
.ph .bestlbl{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:14px 8px 6px}
.ph.add{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;border:2px dashed #CFC6B8;background:transparent;font-weight:600;color:var(--muted);font-size:14px}
.ph.add b{font-size:28px;font-weight:300;line-height:1}
.ph.pick{cursor:pointer;outline:0 solid var(--ink);transition:outline-width .1s}
.ph.pick.on{outline-width:4px;outline-offset:-4px}
.ph.pick.on:after{content:'★ Best';position:absolute;left:6px;bottom:6px;background:#FFD23F;font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px}
.banner{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:16px;background:#FFF3C8;border:1px solid #F2DC8B}
.empty{padding:30px 10px;text-align:center;color:var(--muted)}
.book-pages{display:grid;gap:26px;margin-top:22px}
.bpage{margin:0}
.bpage .pg{aspect-ratio:1;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06),0 14px 40px rgba(30,27,23,.12);border-radius:3px;overflow:hidden;position:relative}
.bpage .pg img{width:100%;height:100%;display:block}
.bpage .pg .ld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
.bpage figcaption{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:13px;color:var(--muted)}
.export-grid{display:grid;gap:10px}
@media(min-width:620px){.export-grid{grid-template-columns:repeat(3,1fr)}}
.export{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:16px;border-radius:16px;background:#fff;border:1.5px solid var(--line)}
.export b{font-size:16px}.export span{font-size:13px;color:var(--muted)}
.export .ic{font-size:22px;margin-bottom:4px}
.export:active{transform:scale(.98)}
.footer{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0 20px}
.minis{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
.minis::-webkit-scrollbar{display:none}
.mini{flex:none;width:132px;aspect-ratio:1;border-radius:4px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;box-shadow:0 8px 22px rgba(30,27,23,.16);scroll-snap-align:start;text-align:center}
.mini.dark{background:#141212;color:#F3ECE2}.mini.cream{background:#F1EBE1;color:#1E1B17}
.mini b{font-size:9px;font-weight:800;letter-spacing:.02em;line-height:1.1}
.mini small{font-size:5px;letter-spacing:.3em;font-weight:600;color:#857C70}
.mhero{width:100%;height:52px;border-radius:3px;background:linear-gradient(180deg,#7fb2e5,#4b7fae 55%,#5b7d3e)}
.mbar{display:flex;width:100%;height:3px;border-radius:2px;overflow:hidden}.mbar i{flex:1}
.mcards{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%}.mcards i{aspect-ratio:3/4;border:2px solid;border-radius:3px;background:linear-gradient(180deg,#d9c7b8,#b9a291)}
.mframe{width:80%;height:46px;border:2px solid;border-radius:4px;background:linear-gradient(180deg,#86b7e8,#6c5aa8 60%,#4f7a3b)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:100%;height:100%}.mgrid i{border-radius:3px}
.mgrid5{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;width:90%}.mgrid5 i{aspect-ratio:1;border-radius:2px}
.oauth{gap:10px;font-weight:600}.oauth .oic{display:inline-flex}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.stepbar{display:flex;gap:6px}.stepbar i{flex:1;height:6px;border-radius:99px;background:#E2DACD}.stepbar i.on{background:var(--ink)}
#bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,253,249,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
#bnav .nb{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:14px;font-size:12px;font-weight:600;color:var(--muted)}
#bnav .nb.on{color:var(--ink)}
#bnav .nb.on .ni{background:#EFE8DC}
#bnav .ni{display:flex;align-items:center;justify-content:center;width:46px;height:30px;border-radius:99px}
#bnav .nbplus .ni{background:var(--ink);color:#fff}
#bnav .nbplus{color:var(--ink)}
body.hasnav .wrap{padding-bottom:120px}
body.hasnav #toasts{bottom:calc(86px + env(safe-area-inset-bottom))}
.libcard{padding:0;overflow:hidden}
.libtop{display:block;text-decoration:none}
.libstrip{display:flex;height:14px}.libstrip i{flex:1}
.ph .loc{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:10px;font-weight:600;padding:12px 6px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{white-space:nowrap}
@media(max-width:440px){.topbar.tight .bt{display:none}}
.auto-grid{grid-template-columns:repeat(4,1fr)}
@media(min-width:620px){.auto-grid{grid-template-columns:repeat(6,1fr)}}
.swatch .swx{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;background:#fff;font-size:12px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.autocard{border:2px solid var(--ink)}
.automark{width:44px;height:44px;flex:none;display:grid;grid-template-columns:1fr 1fr;gap:3px}.automark i{border-radius:6px;display:block}
.autohint{align-self:flex-start;font-weight:600;font-size:14px;padding:10px 14px;border-radius:12px;background:#FFF3C8;width:100%;text-align:left}
.seg{display:flex;background:#EAE3D6;border-radius:99px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px;border-radius:99px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ph .ctag{position:absolute;left:4px;right:4px;bottom:4px;border-radius:99px;font-size:10px;font-weight:700;padding:3px 6px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.ph .beststar{position:absolute;left:5px;top:5px;width:22px;height:22px;border-radius:50%;background:#FFD23F;font-size:12px;display:flex;align-items:center;justify-content:center}
.foundrow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:#fff}
.foundrow.on{border-color:var(--ink)}
.foundrow .fsw{width:34px;height:34px;border-radius:10px;flex:none;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.fbar{height:5px;border-radius:99px;background:#EEE8DD;margin-top:5px;overflow:hidden}.fbar i{display:block;height:100%;border-radius:99px}
.covgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.covpick{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.covimg{width:100%;aspect-ratio:4/3;border-radius:12px;background:#E9E3D8 center/cover no-repeat;display:flex;align-items:center;justify-content:center}
.upg{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.upgic{width:44px;height:44px;border-radius:12px;background:#F1EBE1;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
/* modals */
#modals .ov{position:fixed;inset:0;background:rgba(20,17,13,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .2s}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1);position:relative}
.sheet.dark{background:#15120E;color:#F6F2EA}
.sheet.dark .muted{color:#A79E90}
.sheet .x{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;background:rgba(127,127,127,.15);font-size:18px;display:flex;align-items:center;justify-content:center}
@media(min-width:700px){#modals .ov{align-items:center;padding:20px}.sheet{border-radius:24px}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#toasts{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:80;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:up .25s;max-width:90vw}
.uploading{position:fixed;right:16px;top:16px;z-index:60;background:var(--ink);color:#fff;border-radius:99px;padding:8px 14px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block}
.spin.dk{border-color:rgba(0,0,0,.15);border-top-color:var(--ink)}
@keyframes sp{to{transform:rotate(360deg)}}
/* editor */
.crop-stage{height:min(54vh,520px);background:#000;border-radius:14px;overflow:hidden}
.crop-stage img{display:block;max-width:100%}
.crop-stage .cropper-container img{filter:var(--f,none)}
.edit-tools{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.edit-tools::-webkit-scrollbar{display:none}
.tbtn{flex:none;padding:8px 13px;border-radius:999px;border:1.5px solid #3a342c;color:#F6F2EA;font-size:13px;font-weight:600}
.tbtn.on{background:#F6F2EA;color:#15120E;border-color:#F6F2EA}
.adj{display:grid;grid-template-columns:86px 1fr 38px;gap:10px;align-items:center;font-size:13px;margin-top:8px}
.adj input{accent-color:#F6F2EA}
.sheet.dark .btn{background:#F6F2EA;color:#15120E;border-color:#F6F2EA}
.sheet.dark .btn.ghost{background:transparent;color:#F6F2EA;border-color:#4a433a}
/* reveal */
.reveal{text-align:center;padding:10px 0}
.reveal .orb{width:190px;height:190px;border-radius:50%;margin:16px auto 22px;animation:pop .9s cubic-bezier(.2,1.4,.4,1);box-shadow:0 20px 60px var(--glow)}
@keyframes pop{0%{transform:scale(.2) rotate(-90deg);opacity:0}100%{transform:none;opacity:1}}
.reveal .nm{font-family:var(--serif);font-weight:800;text-transform:uppercase;font-size:52px;line-height:1}
.overlay-progress{position:fixed;inset:0;z-index:90;background:rgba(246,242,234,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px}
.overlay-progress .bar{width:min(320px,80vw);height:8px;background:#E2DACD;border-radius:99px;overflow:hidden}
.overlay-progress .bar i{display:block;height:100%;background:var(--ink);width:0;transition:width .2s}
.notice{padding:14px 16px;border-radius:14px;background:#fff;border:1px dashed #CFC6B8;font-size:14px;line-height:1.45}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="app"></div>
<div id="modals"></div>
<div id="toasts"></div>
<script>/*CROPPER_JS*/</script>
<script>
"use strict";
/* ==================== config ==================== */
const INVITE_BASE = "/*INVITE_BASE*/";
const WEB = !!window.__CH_WEB;
const JSPDF_URL = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
const JSZIP_URL = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
const PAPER = "#FBF9F4", INK = "#1E1B17", MUTED = "#857C70";

function colorDist(a,b){ const x=hexRgb(a), y=hexRgb(b); return Math.sqrt((x[0]-y[0])**2+(x[1]-y[1])**2+(x[2]-y[2])**2); }
function extraColors(pal, n=8){
  const names=new Set(pal.map(c=>c.name.toLowerCase()));
  const out=[];
  for (const [name,hex] of EXTRA_COLORS){
    if (names.has(name.toLowerCase())) continue;
    if (pal.some(c=>colorDist(c.hex,hex)<55) || out.some(c=>colorDist(c.hex,hex)<55)) continue;
    out.push({name,hex}); if (out.length>=n) break;
  }
  return out;
}

function openModal(content, {dark=false, onClose, closable=true}={}){
  const sheet = h("div",{class:"sheet"+(dark?" dark":""), role:"dialog", "aria-modal":"true"});
  const ov = h("div",{class:"ov"}, sheet);
  let closed=false;
  const close = (val)=>{ if(closed) return; closed=true; ov.remove(); onClose && onClose(val); };
  if (closable){
    sheet.append(h("button",{class:"x","aria-label":"Close", onclick:()=>close()},"✕"));
    ov.addEventListener("click", e=>{ if(e.target===ov) close(); });
  }
  sheet.append(content);

  return {close, sheet, body:content};
}

/* ==================== routing & data ==================== */
function parseRoute(){
  const x = (location.hash||"").replace(/^#/,""); let m;
  if (x==="create") return {v:"create"};
  if (x==="library") return {v:"library"};
  if (x==="auto") return {v:"auto"};
  if ((m = x.match(/^h(\d{4})(-book)?$/))) return {v: m[2] ? "book" : "hunt", code:m[1]};
  return {v:"home"};
}
function go(hash){ if (location.hash.replace(/^#/,"")===hash) route(); else location.hash = hash; }
function route(){
  const prev = S.route;
  S.route = parseRoute();
  if (S.route.code) watchHunt(S.route.code); else unwatch();
  renderView();
  if (!prev || prev.v!==S.route.v) window.scrollTo(0,0);
}
function unwatch(){ S.unsubs.forEach(u=>{try{u()}catch(e){}}); S.unsubs=[]; S.code=null; S.hunt=undefined; S.hunters=[]; S.photos=[]; S.photoMap={}; S.bookSig=null; }
function watchHunt(code){
  if (S.code===code) return;
  unwatch(); S.code=code; S.slow=false;

async function loadLibrary(){
  const uid=S.uid, m=new Map();
  const add=(x,role)=>{ const prev=m.get(x.code); const rank={organizer:3,hunter:2,viewed:1};
    if(!prev || rank[role]>rank[prev.role]) m.set(x.code,{code:x.code,title:x.title,role,at:Math.max(x.at||0,prev?prev.at:0)}); else prev.at=Math.max(prev.at||0,x.at||0); };
  LS.get("recent",[]).forEach((x,i)=>add({...x,at:x.at||(Date.now()-i*1000)},"viewed"));
  const [own, mine] = await Promise.all([
    S.db.collection("hunts").where("createdBy","==",uid).limit(50).get().then(s=>s.docs.map(d=>({code:d.id,title:d.data().title,at:d.data().createdAt}))).catch(()=>[]),
    S.account ? S.db.doc("users/"+uid).get().then(s=>(s.exists&&s.data().hunts)||[]).catch(()=>[]) : Promise.resolve([])
  ]);
  mine.forEach(x=>add(x,x.role||"hunter")); own.forEach(x=>add(x,"organizer"));
  const list=[...m.values()].sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,40);
  const docs=await Promise.all(list.map(x=>S.db.doc("hunts/"+x.code).get().then(s=>s.exists?s.data():null).catch(()=>null)));
  return list.map((x,i)=>docs[i]?{...x,hunt:docs[i]}:null).filter(Boolean);
}

async function createHunt(data){
  for (let i=0;i<14;i++){
    const code = String(1000 + Math.floor(Math.random()*9000));
    const ref = S.db.doc("hunts/"+code);
    let leased = true;
    try{ const r = await ref.acquire({holder:S.uid, ttlMs:5000}); leased = r.acquired; }catch(e){ leased = true; }
    if (!leased) continue;
    const snap = await ref.get();
    if (snap.exists) continue;
    await tryWrite(()=>ref.set({...data, code, createdBy:S.uid, createdAt:Date.now(), status:"open"}));
    rememberHunt({code, title:data.title});
    recordMyHunt(code, data.title, "organizer");
    return code;
  }
  throw new Error("Couldn't find a free code — please try again.");
}

async function joinHunt(code, st){
  const lock = S.db.doc(`hunts/${code}/locks/colors`);
  for (let i=0;i<8;i++){
    try{ const r = await lock.acquire({holder:S.uid+"-"+rid(4), ttlMs:6000}); if (r.acquired) break; }catch(e){ break; }
    await sleep(500+Math.random()*500);
  }
  const fresh = (await S.db.collection(`hunts/${code}/hunters`).get()).docs.map(d=>({id:d.id,...d.data()}));
  const hunt = S.hunt;
  const pal = [...(((await S.db.doc("hunts/"+code).get()).data()||hunt).palette||hunt.palette||[])];
  const counts = colorCounts(fresh);
  const allUsed = pal.length>0 && pal.every(c=>counts[c.hex.toLowerCase()]);
  const least = ()=>{ const min = Math.min(...pal.map(c=>counts[c.hex.toLowerCase()]||0)); return pal.filter(c=>(counts[c.hex.toLowerCase()]||0)===min); };
  let color = st.color;
  if (hunt.mode==="choose"){
    if (color && hunt.unique && counts[color.hex.toLowerCase()] && pal.find(c=>c.hex===color.hex)){ const e=new Error("Someone just grabbed "+color.name+". Pick another color."); throw e; }
    if (!color){ color = (hunt.unique && allUsed) ? extraColors(pal,1)[0] : least()[0]; }
  } else if (hunt.unique && allUsed){
    const ex = extraColors(pal, hunt.mode==="random"?6:1); color = ex[hunt.mode==="random"?Math.floor(Math.random()*ex.length):0];
  } else if (hunt.mode==="random"){
    const pool = least(); color = pool[Math.floor(Math.random()*pool.length)];
  } else {
    color = least()[0];
  }
  if (!color) color = least()[0];
  if (!color) throw new Error("This hunt has no colors set up.");
  if (!pal.find(c=>c.hex.toLowerCase()===color.hex.toLowerCase())){
    pal.push({name:color.name, hex:color.hex.toUpperCase()});
    try{ await tryWrite(()=>S.db.doc("hunts/"+code).update({palette:pal})); }catch(e){ console.warn(e); }
  }
  const id = rid();
  const doc = { name:st.name, color:{name:color.name, hex:color.hex}, selfie:st.selfie||null, uid:S.uid, joinedAt:Date.now(), best:null };
  await tryWrite(()=>S.db.doc(`hunts/${code}/hunters/${id}`).set(doc));
  const mine = LS.get("mine."+code, []); mine.push(id); LS.set("mine."+code, mine); LS.set("active."+code, id);
  recordMyHunt(code, hunt.title, "hunter");
  return {id, ...doc};
}

async function startUpload(me, files){
  files = files.filter(f=>/^image\//.test(f.type) || /\.(jpe?g|png|webp|heic|heif|gif)$/i.test(f.name));
  if (!files.length) return;
  const max = S.hunt.maxPhotos||20;
  const have = S.photos.filter(p=>p.hunter===me.id).length;
  const room = max - have;
  if (room<=0){ toast("You've reached the photo limit"); return; }
  if (files.length>room){ toast(`Only ${room} more photo${room>1?"s":""} allowed — using the first ${room}.`,4000); files = files.slice(0,room); }
  let saved=0;
  const metas = await Promise.all(files.map(f=>readPhotoMeta(f)));
  for (let i=0;i<files.length;i++){
    let out;
    try{ out = await editImage(files[i],{title:`Photo ${i+1} of ${files.length}`, accent:me.color.hex, multi:files.length>1, remaining:files.length-i}); }
    catch(e){ toast("Couldn't open that photo (try a JPG or PNG)"); continue; }
    if (out==="cancel") break;
    if (out==="all"){
      for (let j=i;j<files.length;j++){ try{ const c=await fileToCanvas(files[j]); saved++; queueSave(me,{canvas:c,meta:metas[j]}); }catch(e){ toast("Couldn't open one of the photos"); } }
      break;
    }
    if (!out) continue;
    out.meta = metas[i];
    saved++;
    queueSave(me, out);
  }
  if (!saved) return;
  await S.saveChain;
  for (let k=0;k<30 && !S.photos.some(p=>p.hunter===me.id);k++) await sleep(100);
  await sleep(300);
  pickBest(me, true);
}
function queueSave(me, out){
  S.pending++; renderUploadPill();
  S.saveChain = S.saveChain.then(()=>savePhoto(me, out)).catch(e=>{ toast(errMsg(e),5000); }).finally(()=>{ S.pending--; renderUploadPill(); });
}
async function savePhoto(me, out, opt={}){
  const code=opt.code||S.code, pid=opt.pid||rid();

  const doc = { hunter:me.id, w:c.width, h:c.height, t:toThumb(c,400,.62), createdAt:opt.createdAt||Date.now(), uid:S.uid };
  const meta = out.meta || {};

  if (meta.lat!=null){ doc.lat=meta.lat; doc.lng=meta.lng; const pn=await placeName(meta.lat,meta.lng); if(pn) doc.place=pn; }
  if (S.assets){
    try{ const blob = await canvasBlob(c,"image/jpeg",.88); const r = await S.assets.upload(blob,{type:"image/jpeg"}); doc.a = r.id; }
    catch(e){ console.warn("asset upload failed, storing in db", e); }
  }
  if (!doc.a){

async function readPhotoMeta(file){
  try{
    const buf=await file.slice(0,262144).arrayBuffer(); const v=new DataView(buf);
    if (v.byteLength<4 || v.getUint16(0)!==0xFFD8) return null;
    let off=2;
    while (off < v.byteLength-10){
      const marker=v.getUint16(off), len=v.getUint16(off+2);
      if ((marker & 0xFF00)!==0xFF00) break;
      if (marker===0xFFE1 && v.getUint32(off+4)===0x45786966) return parseExif(v, off+10);
      off += 2+len;
    }
  }catch(e){}
  return null;
}
function parseExif(v,t){
  const out={};
  try{
    const le=v.getUint16(t)===0x4949, u16=o=>v.getUint16(o,le), u32=o=>v.getUint32(o,le);
    const rat=o=>{ const d=u32(o+4); return d ? u32(o)/d : 0; };
    const ifd=o=>{ const n=u16(o), tags={}; for(let i=0;i<n;i++){ const e=o+2+i*12; tags[u16(e)]={count:u32(e+4),val:e+8}; } return tags; };
    const at=e=>t+u32(e.val);
    const str=e=>{ const o=e.count>4?at(e):e.val; let s=""; for(let i=0;i<e.count-1;i++) s+=String.fromCharCode(v.getUint8(o+i)); return s; };
    const ifd0=ifd(t+u32(t+4));
    const dt = ifd0[0x8769] ? (()=>{ const ex=ifd(at(ifd0[0x8769])); return ex[0x9003]||ex[0x9004]; })() : ifd0[0x0132];
    if (dt){ const m=str(dt).match(/(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d)/); if(m) out.takenAt=new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5]).getTime(); }
    if (ifd0[0x8825]){
      const g=ifd(at(ifd0[0x8825]));
      const coord=e=>{ const o=at(e); return rat(o)+rat(o+8)/60+rat(o+16)/3600; };
      if (g[2] && g[4]){
        let lat=coord(g[2]), lng=coord(g[4]);
        if (g[1] && String.fromCharCode(v.getUint8(g[1].val))==="S") lat=-lat;
        if (g[3] && String.fromCharCode(v.getUint8(g[3].val))==="W") lng=-lng;
        if (isFinite(lat) && isFinite(lng) && Math.abs(lat)<=90 && Math.abs(lng)<=180 && !(lat===0 && lng===0)){ out.lat=+lat.toFixed(5); out.lng=+lng.toFixed(5); }
      }
    }
  }catch(e){}
  return out;
}

function smartCrop(iw, ih, ra, p){

    const sx = clamp((t.x0+t.x1)/2 - sw/2, Math.max(0,t.x1-sw), Math.min(iw-sw, t.x0));
    const room = sh-(t.y1-t.y0);
    const sy = clamp(t.y0 - room*0.3, Math.max(0,t.y1-sh), Math.min(ih-sh, t.y0));
    return [clamp(sx,0,iw-sw), clamp(sy,0,ih-sh), sw, sh];
  };

    const B=p.faces.map(([x,y,w,h])=>({
      body:{x0:(x-w*0.7)*iw, x1:(x+w*1.7)*iw, y0:(y-h*0.55)*ih, y1:Math.min(ih,(y+h*3.4)*ih)},
      head:{x0:(x-w*0.15)*iw, x1:(x+w*1.15)*iw, y0:Math.max(0,(y-h*0.5)*ih), y1:Math.min(ih,(y+h*1.2)*ih)}, area:w*h }));

    const fits=t=>(t.x1-t.x0)<=sw+0.5 && (t.y1-t.y0)<=sh+0.5;
    const allBodies=U(B.map(b=>b.body)); if (fits(allBodies)) return place(allBodies);

    const maxA=Math.max(...B.map(b=>b.area));
    const inside=(r,x,y)=>r.x0>=x-1 && r.x1<=x+sw+1 && r.y0>=y-1 && r.y1<=y+sh+1;
    const overlaps=(r,x,y)=>r.x1>x && r.x0<x+sw && r.y1>y && r.y0<y+sh;
    let best=null; const stepsX=iw-sw>1?24:0, stepsY=ih-sh>1?16:0;
    for (let i=0;i<=stepsX;i++) for (let j=0;j<=stepsY;j++){
      const x=stepsX?(iw-sw)*i/stepsX:0, y=stepsY?(ih-sh)*j/stepsY:0; let sc=0;

    }

  }

}

  if (faces.length){ let ax=0,ay=0,aw=0; faces.forEach(([x,y,w,h])=>{ const a=w*h; ax+=(x+w/2)*a; ay+=(y+h*0.9)*a; aw+=a; }); return {faces, focus:{x:+(ax/aw).toFixed(3), y:+Math.min(0.85,ay/aw).toFixed(3)}}; }

function layoutPhotos(ps, box, prevKey, g=12){
  const n=ps.length;
  if (n===1){ const a=aspectOf(ps[0]), ba=box.w/box.h; let w,hh; if(a>ba){w=box.w;hh=w/a;}else{hh=box.h;w=hh*a;} return {key:"1",items:[{r:{x:box.x+(box.w-w)/2,y:box.y+(box.h-hh)/2,w,h:hh},p:ps[0]}]}; }
  let best=null;
  (TPL[n]||[]).forEach((tpl,ti)=>{
    const rects=tpl.map(c=>gridRect(c,box,g)); const key=n+"-"+ti;
    // largest slot gets first photo (best/hero), the rest matched by aspect
    const idx=rects.map((r,i)=>i); const big=idx.reduce((a,b)=>rects[b].w*rects[b].h>rects[a].w*rects[a].h?b:a,0);
    const restSlots=idx.filter(i=>i!==big).sort((a,b)=>rects[a].w/rects[a].h-rects[b].w/rects[b].h);
    const restPhotos=ps.slice(1).map((p,i)=>i+1).sort((a,b)=>aspectOf(ps[a])-aspectOf(ps[b]));
    const assign=new Array(n); assign[big]=0; restSlots.forEach((s,i)=>assign[s]=restPhotos[i]);
    let cost=0; rects.forEach((r,i)=>{ cost+=Math.abs(Math.log((r.w/r.h)/aspectOf(ps[assign[i]]))); });
    if (key===prevKey) cost+=1.2;
    cost += ((ps.length*7+ti*13)%5)*0.04; // gentle variety
    if(!best||cost<best.cost) best={cost,key,items:rects.map((r,i)=>({r,p:ps[assign[i]]}))};
  });
  return best;
}

function cardGrid(els, items, area, opts){

const IMG_CACHE = new Map(); const IMG_MAX = 36;
function assetUrl(id){ return window.CH_ASSET_URL ? window.CH_ASSET_URL(id) : "/_blob/"+id; }
function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); if(/^https?:/.test(src)) i.crossOrigin="anonymous"; i.decoding="async"; i.onload=()=>res(i); i.onerror=()=>rej(new Error("img")); i.src=src; }); }
function cacheGet(key, make){
  if (IMG_CACHE.has(key)){ const v=IMG_CACHE.get(key); IMG_CACHE.delete(key); IMG_CACHE.set(key,v); return v; }
  const p = make().catch(()=>null); IMG_CACHE.set(key,p);
  while (IMG_CACHE.size>IMG_MAX){ IMG_CACHE.delete(IMG_CACHE.keys().next().value); }
  return p;
}
function imageFor(el, needPx){
  if (el.selfie){ const x=S.hunters.find(y=>y.id===el.selfie); if(!x||!x.selfie) return Promise.resolve(null); return cacheGet("s:"+x.id+":"+x.selfie.length, ()=>loadImg(x.selfie)); }
  const p = S.photoMap[el.pid]; if(!p) return Promise.resolve(null);
  const small = needPx <= 420 && p.t;
  return cacheGet(p.id+(small?":t":":f"), async()=>{
    if (small) return loadImg(p.t);
    if (p.a){ try{ return await loadImg(assetUrl(p.a)); }catch(e){} }
    if (p.hasData){ try{ const s=await S.db.doc(`hunts/${S.code}/photodata/${p.id}`).get(); const d=s.exists&&s.data().d; if(d) return await loadImg(d); }catch(e){} }
    return p.t ? loadImg(p.t) : null;
  });
}
let fontsReady=null;
function ensureFonts(){
  if(!fontsReady) fontsReady = Promise.all(["400 20px Poppins","500 20px Poppins","600 20px Poppins","700 40px Poppins","800 40px Poppins"].map(f=>document.fonts.load(f))).catch(()=>{}).then(()=>document.fonts.ready);
  return fontsReady;
}
function fontStr(e,s){ const w = e.f==="serif" ? 700 : (e.wt||400); return `${w} ${s}px Poppins, system-ui, sans-serif`; }
function measure(ctx, txt, ls, s){ return ctx.measureText(txt).width + (ls? ls*s*Math.max(0,[...txt].length-1) : 0); }
function wrapLines(ctx, txt, w, ls, s){

  for (const wd of words){ const t=cur?cur+" "+wd:wd; if(measure(ctx,t,ls,s)<=w || !cur) cur=t; else { lines.push(cur); cur=wd; } }
  if (cur) lines.push(cur); return lines;
}
function drawSpaced(ctx, txt, x, y, ls, s, al, accent){
  if (!ls && !accent){ ctx.textAlign=al; ctx.fillText(txt,x,y); return; }
  const chars=[...txt]; const tw=measure(ctx,txt,ls,s); let cx = al==="center"? x-tw/2 : al==="right"? x-tw : x;
  ctx.textAlign="left"; const base=ctx.fillStyle; for(const ch of chars){ if(accent) ctx.fillStyle = ch===":" ? accent : base; ctx.fillText(ch,cx,y); cx += ctx.measureText(ch).width + ls*s; }
}

async function drawPage(page, size, canvas){

  const ctx=canvas.getContext("2d"); const k=size/1000;
  ctx.setTransform(k,0,0,k,0,0); ctx.imageSmoothingQuality="high";
  ctx.fillStyle=page.bg||PAPER; ctx.fillRect(0,0,1000,1000);
  const imgs = await Promise.all(page.els.map(e=>{
    if (e.t==="img") return imageFor(e, Math.max(e.w,e.h)*k);
    if (e.t==="map") return Promise.all(mapTiles(e).map(t=>cacheGet(t.url,()=>loadImg(t.url)).then(img=>({...t,img})).catch(()=>({...t,img:null}))));

    ctx.save();

      const im=imgs[i];
      if (im && im.naturalWidth){ const [sx,sy,sw,sh]=smartCrop(im.naturalWidth, im.naturalHeight, e.w/e.h, e.pid?S.photoMap[e.pid]:null); ctx.drawImage(im,sx,sy,sw,sh,e.x,e.y,e.w,e.h); }

/* ==================== MAP PAGES ==================== */
const TILE_URL = (z,x,y)=>`https://tile.openstreetmap.org/${z}/${x}/${y}.png`;
const lng2x=(lng,z)=>(lng+180)/360*256*Math.pow(2,z);
const lat2y=(lat,z)=>{ const r=Math.max(-85,Math.min(85,lat))*Math.PI/180; return (1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*256*Math.pow(2,z); };
function mapView(pts,w,h){
  let z=16;
  for (;z>2;z--){ const xs=pts.map(p=>lng2x(p.lng,z)), ys=pts.map(p=>lat2y(p.lat,z)); if (Math.max(...xs)-Math.min(...xs)<=w*0.72 && Math.max(...ys)-Math.min(...ys)<=h*0.72) break; }
  if (pts.length===1 || z>15) z=Math.min(z,14);
  const xs=pts.map(p=>lng2x(p.lng,z)), ys=pts.map(p=>lat2y(p.lat,z));
  return {z, cx:(Math.min(...xs)+Math.max(...xs))/2, cy:(Math.min(...ys)+Math.max(...ys))/2};
}
function mapEl(box, pins){
  const v=mapView(pins,box.w,box.h);
  return {t:"map",...box,r:14,z:v.z,cx:v.cx,cy:v.cy,pins:pins.map(p=>({px:lng2x(p.lng,v.z),py:lat2y(p.lat,v.z),c:p.c,label:p.label}))};
}
function mapTiles(e){
  const x0=e.cx-e.w/2, y0=e.cy-e.h/2, n=Math.pow(2,e.z), out=[];
  for (let tx=Math.floor(x0/256); tx<=Math.floor((x0+e.w)/256); tx++) for (let ty=Math.floor(y0/256); ty<=Math.floor((y0+e.h)/256); ty++){
    if (ty<0||ty>=n) continue; out.push({tx,ty,url:TILE_URL(e.z,((tx%n)+n)%n,ty)});
  }
  return out;
}
function drawMap(ctx,e,tiles){
  ctx.beginPath(); rr(ctx,e.x,e.y,e.w,e.h,e.r||0); ctx.clip();
  ctx.fillStyle="#EAE6DC"; ctx.fillRect(e.x,e.y,e.w,e.h);
  const x0=e.cx-e.w/2, y0=e.cy-e.h/2;
  let any=false;
  (tiles||[]).forEach(t=>{ if(t.img){ any=true; ctx.drawImage(t.img, e.x+t.tx*256-x0, e.y+t.ty*256-y0, 256.5, 256.5); } });
  if (!any){ ctx.strokeStyle="rgba(0,0,0,.06)"; ctx.lineWidth=1; for(let gx=e.x;gx<e.x+e.w;gx+=40){ctx.beginPath();ctx.moveTo(gx,e.y);ctx.lineTo(gx,e.y+e.h);ctx.stroke();} for(let gy=e.y;gy<e.y+e.h;gy+=40){ctx.beginPath();ctx.moveTo(e.x,gy);ctx.lineTo(e.x+e.w,gy);ctx.stroke();} }
  const labeled=e.pins.some(p=>p.label);
  e.pins.forEach(p=>{ const sx=e.x+p.px-x0, sy=e.y+p.py-y0, r=labeled?17:12;
    ctx.save(); ctx.shadowColor="rgba(0,0,0,.3)"; ctx.shadowBlur=6; ctx.shadowOffsetY=2;
    ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(sx,sy,r+4,0,Math.PI*2); ctx.fill(); ctx.restore();
    ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2); ctx.fill();
    if (p.label){ ctx.fillStyle=onColor(p.c); ctx.font="700 16px Poppins, system-ui, sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(p.label,sx,sy+1); }
  });
  ctx.textBaseline="alphabetic";
  if (any){ ctx.font="400 11px Poppins, system-ui, sans-serif"; ctx.textAlign="right"; const txt="© OpenStreetMap contributors"; const w=ctx.measureText(txt).width; ctx.fillStyle="rgba(255,255,255,.8)"; ctx.fillRect(e.x+e.w-w-12,e.y+e.h-20,w+12,20); ctx.fillStyle="#555"; ctx.fillText(txt,e.x+e.w-6,e.y+e.h-6); }
}
function mapPagesFor(x, ps){
  const located=ps.filter(p=>p.lat!=null&&p.lng!=null); if(!located.length) return null;
  const col=x.color.hex, els=[];
  els.push(eyebrow(`Where the ${x.color.name} was found`,500,80,{s:15,ls:.3,c:MUTED,w:860}));
  els.push(T(`${x.color.name} on the map`,500,140,{f:"serif",s:52,w:860,c:onLight(col)}));
  els.push(mapEl({x:70,y:195,w:860,h:540}, located.map((p,i)=>({lat:p.lat,lng:p.lng,c:col,label:String(i+1)}))));
  const shown=located.slice(0,12), cols=Math.min(6,shown.length), rows=Math.ceil(shown.length/6), g=10;
  const cell=Math.min(90,(860-(cols-1)*g)/cols); const rowW=cols*cell+(cols-1)*g; const top=760;
  shown.forEach((p,i)=>{ const r=Math.floor(i/6), c=i%6, inRow=Math.min(6,shown.length-r*6); const rw=inRow*cell+(inRow-1)*g;
    const xx=500-rw/2+c*(cell+g), yy=top+r*(cell+g);
    els.push({t:"img",x:xx,y:yy,w:cell,h:cell,pid:p.id,r:8,ph:mix(col,"#fff",.6)});
    els.push({t:"circle",cx:xx+14,cy:yy+14,r:12,c:col}); els.push(T(String(i+1),xx+14,yy+14,{s:13,wt:700,c:onColor(col)}));
  });
  const tp=topPlace(located); const note=[tp, located.length<ps.length?`${located.length} of ${ps.length} photos had location info`:null].filter(Boolean).join("  ·  ");
  if (note) els.push(T(note,500,top+rows*(cell+g)+28,{s:15,c:MUTED,w:860}));
  return {kind:"map",label:`${x.color.name} map`,els,bg:CREAM_BG,hid:x.id};
}
function overviewMapPage(H){
  const pins=[]; H.forEach(x=>photosOf(x).forEach(p=>{ if(p.lat!=null) pins.push({lat:p.lat,lng:p.lng,c:x.color.hex}); }));
  if (pins.length<2) return null;
  const els=[eyebrow("Every find, everywhere",500,80,{s:15,ls:.3,c:MUTED}), T("Where we hunted",500,140,{f:"serif",s:56,w:860}), mapEl({x:70,y:195,w:860,h:620},pins)];
  const used=H.filter(x=>photosOf(x).some(p=>p.lat!=null)); const dw=Math.min(150,860/Math.max(1,used.length));
  used.forEach((x,i)=>{ const cx=500-(used.length-1)*dw/2+i*dw; els.push({t:"circle",cx:cx-dw/2+18,cy:870,r:9,c:x.color.hex,edge:lum(x.color.hex)>.8}); els.push(T(x.color.name,cx-dw/2+34,870,{al:"left",s:15,wt:600,w:dw-40})); });
  return {kind:"map",label:"Where we hunted",els,bg:CREAM_BG};
}

function viewBook(){
  if (!S.db) return noDbView();
  const code=S.route.code;
  if (S.hunt===undefined) return loadingView("Loading the book…");
  if (S.hunt===null) return h("div",{class:"wrap"},h("div",{class:"topbar"},brand()),h("div",{class:"card"},h("h2",null,"No hunt with code "+code)));

  const hunt=S.hunt;
  const ex = (ic,t,s,fn)=>h("button",{class:"export",onclick:fn},h("span",{class:"ic"},ic),h("b",null,t),h("span",null,s));
  const root = h("div",{class:"wrap wide"},
    h("div",{class:"topbar"}, h("a",{class:"btn ghost sm",href:"#h"+code},"‹ Back to hunt"), h("span",{class:"pill codechip"},code)),
    h("div",{class:"eyebrow"},"Photo book"),
    h("h2",{style:"margin:6px 0 4px"}, hunt.title),
    h("p",{class:"muted",id:"bookmeta"},""),
    h("div",{class:"card stack",style:"margin-top:18px"},
      h("div",{class:"eyebrow"},"Export"),
      h("div",{class:"export-grid"},
        ex("🖨","Print-ready PDF","8 × 8 in at 300 dpi — for photo-book printers",()=>exportPDF("print")),
        ex("📖","Digital book PDF","Smaller file for texting & email",()=>exportPDF("digital")),
        ex("📱","Social posts","1080 × 1080 JPGs in a .zip — carousel-ready",()=>exportSocial())),
      h("p",{class:"hint"},"Instagram carousels hold up to 20 slides. Tap ", h("b",null,"Save")," under any page to save just that one.")),
    h("div",{id:"bookcustom"}),
    h("div",{id:"bookfilter",style:"margin-top:20px"}),
    pagesEl);
  setTimeout(updateBook,0);
  return root;
}
let viewerGen=0, viewerUrls=[];
function bookSignature(){
  const hu=S.hunt; return JSON.stringify([hu.title,hu.place,hu.occasion,hu.date,hu.tagline,hu.note,hu.coverPhoto,hu.closingPhoto,hu.spotlightPhoto,hu.premium,hu.palette, sortedHunters().map(x=>[x.id,x.name,x.color,x.best,(x.selfie||"").length]), S.photos.map(p=>p.id+p.hunter).sort()]);
}
function updateBook(){
  if (!S.bookEl) return;
  const sig=bookSignature(); if (sig===S.bookSig) return; S.bookSig=sig;
  S.pages = buildBook();
  const bc=$("#bookcustom"); if (bc) bc.replaceChildren(...bookCustomizeCards());
  const meta=$("#bookmeta"); if(meta) meta.textContent = `${S.pages.length} pages · ${S.hunters.length} hunters · ${S.photos.length} photos · updates live as photos arrive`;
  const gen=++viewerGen; viewerUrls.forEach(u=>URL.revokeObjectURL(u)); viewerUrls=[];
  const queue=[]; let busy=false;
  const size = Math.min(1600, Math.round(Math.min(window.innerWidth-36, 900) * Math.min(2, window.devicePixelRatio||1)));
  const cv = document.createElement("canvas");
  const shells = S.pages.map((p,i)=>{
    const img=h("img",{alt:p.label,style:"display:none"}); const ld=h("div",{class:"ld"},h("span",{class:"spin dk"}));
    const fig=h("figure",{class:"bpage","data-i":i}, h("div",{class:"pg"},img,ld),
      h("figcaption",null, h("span",null,`${i+1} · ${p.label}`), h("button",{class:"btn soft sm",onclick:()=>savePage(i)},"Save")));
    fig._img=img; fig._ld=ld; return fig;
  });
  S.bookEl.replaceChildren(...shells);
  const applyFilter=()=>{ const f=S.bookFilter; shells.forEach((sh,i)=>{ sh.style.display = (!f || S.pages[i].hid===f) ? "" : "none"; }); };
  const fb=$("#bookfilter");
  if (fb){
    const H=sortedHunters(); if (S.bookFilter && !H.some(x=>x.id===S.bookFilter)) S.bookFilter=null;
    const drawChips=()=>fb.replaceChildren(h("div",{class:"eyebrow",style:"margin-bottom:8px"},"View"), h("div",{class:"chips"},
      h("button",{class:"chip"+(!S.bookFilter?" on":""),onclick:()=>{ S.bookFilter=null; drawChips(); applyFilter(); }},"Whole book"),
      H.map(x=>h("button",{class:"chip"+(S.bookFilter===x.id?" on":""),onclick:()=>{ S.bookFilter=x.id; drawChips(); applyFilter(); window.scrollTo({top:fb.getBoundingClientRect().top+scrollY-10,behavior:"smooth"}); }},
        h("i",{style:{width:"12px",height:"12px",borderRadius:"50%",background:x.color.hex,display:"block",boxShadow:"inset 0 0 0 1px rgba(0,0,0,.15)"}}), S.hunt.auto ? x.color.name : `${x.color.name} · ${x.name}`))));
    drawChips();
  }

    if (busy) return; busy=true;
    while(queue.length){ if(gen!==viewerGen) break; const i=queue.shift(); const fig=shells[i];

    }
    busy=false;
  };

  shells.forEach(s=>io.observe(s));
}
async function saveFile(filename, blob){
  if (!S.downloads){ toast("Downloads aren't available in this view — open the page in claude.ai in a browser.",5000); return false; }
  try{ await S.downloads.save({filename, data:blob}); return true; }
  catch(e){ if(e && e.code==="declined") return false; toast(e&&e.code==="too_large"?"That file is too big here — try the digital PDF.":"Couldn't save the file.",4500); return false; }
}
async function savePage(i){
  const pr=progressOverlay("Preparing page…");
  try{ const cv=document.createElement("canvas"); await drawPage(S.pages[i],1440,cv); const b=await canvasBlob(cv,"image/jpeg",.92); pr.done(); await saveFile(`${slugify(S.hunt.title)}-page-${String(i+1).padStart(2,"0")}.jpg`, b); }
  catch(e){ pr.done(); toast("Couldn't make that image"); }
}
async function exportPDF(kind){
  const size = kind==="print"?2400:1300, q = kind==="print"?.9:.8;
  const pages=S.pages; const pr=progressOverlay(kind==="print"?"Building print-ready PDF…":"Building digital book…");
  try{
    if (!window.jspdf) await loadScript(JSPDF_URL);
    const pdf = new window.jspdf.jsPDF({unit:"in",format:[8,8],orientation:"portrait",compress:true});
    const cv=document.createElement("canvas");
    for (let i=0;i<pages.length;i++){
      pr.set(i/pages.length,`Page ${i+1} of ${pages.length}`);
      await drawPage(pages[i],size,cv); const b=await canvasBlob(cv,"image/jpeg",q);
      const buf=new Uint8Array(await b.arrayBuffer());

      pdf.addImage(buf,"JPEG",0,0,8,8,"p"+i,"NONE");
    }
    pr.set(1,"Finishing…");
    const out = pdf.output("blob"); pr.done();
    await saveFile(`${slugify(S.hunt.title)}-${kind==="print"?"print":"book"}.pdf`, out);
  }catch(e){ pr.done(); console.error(e); toast("Couldn't build the PDF: "+(e.message||e),5000); }
}
async function exportSocial(){
  const pages=S.pages; const pr=progressOverlay("Making social posts…");
  try{
    if (!window.JSZip) await loadScript(JSZIP_URL);
    const zip=new window.JSZip(); const cv=document.createElement("canvas"); const base=slugify(S.hunt.title);
    for (let i=0;i<pages.length;i++){ pr.set(i/pages.length,`Post ${i+1} of ${pages.length}`); await drawPage(pages[i],1080,cv); zip.file(`${base}-${String(i+1).padStart(2,"0")}.jpg`, await canvasBlob(cv,"image/jpeg",.92)); }
    pr.set(1,"Zipping…");
    const out=await zip.generateAsync({type:"blob"}); pr.done();
    await saveFile(`${base}-social-posts.zip`, out);
  }catch(e){ pr.done(); console.error(e); toast("Couldn't make the posts: "+(e.message||e),5000); }
}
